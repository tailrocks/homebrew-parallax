# Gate contract (tap class): every CI gate resolves to exactly one disjoint
# mise task; no leaf command identity repeats across gates. install is the
# workflow-level `mise install --locked` command. build = formula Ruby syntax
# check. test = functional test of the verified package updater (platform
# lane). lint = actionlint (workflows) + shellcheck (scripts). fmt = shfmt
# check over the shell scripts (the 2026.9 lane contract runs a fmt gate in
# every class; shfmt is this repository's pinned formatter). ci is the human
# aggregate (depends only, no command). package-update is the package-updater
# workflow's task, not a CI gate.

[tools]
actionlint = "1.7.12"
cosign = "3.1.2"
gh = "2.96.0"
jq = "1.8.2"
ruby = "4.0.6"
shellcheck = "0.11.0"
shfmt = "3.12.0"

[tasks.actionlint]
run = "actionlint"

[tasks.shellcheck]
run = "shellcheck scripts/*.sh"

[tasks.package-update]
run = "./scripts/package-update.sh"

[tasks.package-update-test]
run = "./scripts/test-package-update.sh"

[tasks.build]
run = 'set -e; for f in Formula/*.rb; do ruby -c "$f" || exit 1; done'

[tasks.test]
depends = ["package-update-test"]

[tasks.lint]
depends = ["actionlint", "shellcheck"]

[tasks.fmt]
run = "shfmt -d scripts/*.sh"

[tasks.ci]
depends = ["build", "test", "lint"]

[tasks."brew:tap-local"]
description = "Link this checkout as a trusted tap so bare brew audit resolves it"
run = "tap_dir=\"$(brew --repo)/Library/Taps/tailrocks\" && mkdir -p \"$tap_dir\" && ln -sfn \"$PWD\" \"$tap_dir/homebrew-parallax\" && brew trust tailrocks/parallax"

[tasks."brew:audit"]
description = "Strict online audit of the linked tap (PR1 scaffolding; PR2 runs the bare audit via unit prerequisites)"
depends = ["brew:tap-local"]
run = "brew audit --strict --online"

[settings]
lockfile = true
